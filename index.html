function pp(c){return c.u=='l'?c.m/(c.ps||1):c.m}

function used(id){return S.cart.filter(c=>c.id==id).reduce((a,c)=>a+un(c),0)}

function resH(x){if(!x.found)return `<div class="c"><b class="wn">Couldn't identify a medicine in this photo.</b><p style="margin:6px 0 0">${esc(x.notes||'Try a clearer, closer photo of the front of the pack.')}</p></div>`;
const ex=S.meds.filter(m=>m.n.toLowerCase()==String(x.name||'').toLowerCase());const f=(l,v)=>v?`<tr><td style="color:var(--mu)">${l}</td><td style="white-space:normal">${esc(v)}</td></tr>`:'';
return `<div class="c" style="border-color:var(--ac)"><b style="font-size:17px">${esc(x.name)}</b> <span class="t">${esc(x.confidence||'')} confidence</span>${x.schedule&&x.schedule!='OTC'?' <span class="t">'+esc(schName(x.schedule))+'</span>':x.rx?' <span class="t">Rx</span>':''}<table>${f('Salt',x.salt)}${f('Form',x.form)}${f('Made by',x.manufacturer)}${f('Used for',x.uses)}${f('Batch no.',x.batch||'not visible on photo')}${f('Expiry',x.expiry||'not visible on photo')}${f('MRP',x.mrp?inr(+x.mrp):'not visible on photo')}${f('Pack size',x.units_per_packet)}</table>
${x.notes?`<p class="wn" style="margin:8px 0">Check: ${esc(x.notes)}</p>`:''}${ex.length?`<p class="wn" style="margin:8px 0">Already in your inventory (${ex.map(m=>'batch '+esc(m.b)+': '+fmtQ(m)).join(', ')}). Same batch adds to that stock; a new batch gets its own row so expiry stays correct.</p>`:''}
<p style="margin:8px 0"><b>Add this medicine to your inventory?</b></p><div class="r"><button class="p" onclick="useScan()">Yes, fill the form</button><button class="s" onclick="S.scan={};$('sc').innerHTML=scanH()">No, discard</button></div><small style="color:var(--mu)">AI can make mistakes. Confirm the name, batch and expiry against the pack before saving.</small></div>`}
function stopCam(){try{S.scan.stream&&S.scan.stream.getTracks().forEach(t=>t.stop())}catch(e){}S.scan.stream=null}

function snap(){const v=$('cv');if(!v||!v.videoWidth)return;const c=document.createElement('canvas'),k=Math.min(1,1400/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);stopCam();S.scan={img:c.toDataURL('image/jpeg',.85)};$('sc').innerHTML=scanH()}

async function analyse(){const R=S.scan;R.busy=true;R.err='';R.res=null;$('sc').innerHTML=scanH();
try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:AI_MODEL,max_tokens:1000,system:AI_PROMPT,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:R.img.split(',')[1]}},{type:'text',text:'Identify this medicine pack.'}]}]})});
const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||('Error '+r.status));
const t=(d.content||[]).filter(x=>x.type=='text').map(x=>x.text).join(''),m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('The AI reply could not be read. Try a clearer photo.');R.res=JSON.parse(m[0])}catch(e){R.err='Could not analyse: '+e.message}
R.busy=false;if($('sc'))$('sc').innerHTML=scanH()}
function useScan(){const x=S.scan.res;S.editId=null;draw();const set=(id,v)=>{if(v!=null&&v!==''&&$(id))$(id).value=v};set('an',x.name);set('as',x.salt);set('ab',x.batch);if(/^\d{4}-\d{2}-\d{2}$/.test(x.expiry||''))set('ae',x.expiry);set('ap',x.units_per_packet);set('am',x.mrp);$('ar').value=SCH.some(a=>a[0]==x.schedule)?x.schedule:(x.rx?'H':'OTC');fch('ap');fch('am');$('aq').focus();$('aq').scrollIntoView({behavior:'smooth',block:'center'});toast('Details filled. Enter the quantity and press Add.')}

const nx=a=>1+Math.max(0,...a.map(x=>x.no||0)),pad=(p,n)=>p+String(n).padStart(4,'0');

function retHist(t){const l=S.pret.map((r,i)=>[r,i]).filter(a=>a[0].t==t).reverse();return `<h2 style="margin-top:22px">${t=='ex'?'Expiry credit notes':'Purchase returns'}</h2><div class="c w"><table><tr><th>CN no.</th><th>Date</th><th>Supplier</th><th>Items</th><th>Value</th><th>Status</th></tr>${l.map(([r,i])=>`<tr><td>${r.cn}</td><td>${r.date}</td><td>${esc(r.sup)}</td><td style="white-space:normal">${r.items.map(x=>esc(x.n)).join(', ')}</td><td>${inr(r.tot)}</td><td><button class="s" onclick="retSt(${i})">${r.st=='Received'?'✓ Received':'Pending · mark received'}</button></td></tr>`).join('')||'<tr><td colspan="6">Nothing yet</td></tr>'}</table></div>`}

function saveRet(t,items,sup,reason){if(!items.length){toast('Nothing selected');return false}items.forEach(i=>{S.meds.find(m=>m.id==i.id).q-=i.q});const no=nx(S.pret.filter(r=>r.t==t));S.pret.push({no,t,cn:pad(t=='pr'?'PR-':'EX-',no),date:D(0),sup:sup||'—',reason:reason||'',items,tot:items.reduce((a,i)=>a+i.pr*i.q/i.ps,0),st:'Pending'});save();toast('Saved. Stock reduced.');return true}
function purchase(){const P=S.pc,sub=P.items.reduce((a,i)=>a+i.pr*i.k,0),g=sub*P.gst/100;
return `<h2>Purchase</h2><div class="c" id="psc">${pscanH()}</div><div class="c" style="margin-top:12px"><b>Import lines from Excel / CSV</b><p style="color:var(--mu);margin:4px 0 10px">First row = headings: Medicine, Batch, Expiry, Packets, Units per packet, Purchase rate, MRP, HSN (any order; only Medicine and Packets are required).</p><div class="r"><input type="file" accept=".xlsx,.csv" onchange="pimport(this.files[0]);this.value=''"><button class="s" style="flex:0 0 auto" onclick="ptemplate()">⬇ Sample file</button></div></div><div class="c" style="margin-top:12px"><div class="r">${supIn(P,'S.pc')}<label class="fl"><small>Supplier invoice no.</small><input value="${esc(P.inv)}" oninput="S.pc.inv=this.value"></label><label class="fl"><small>Date</small><input type="date" value="${P.date}" oninput="S.pc.date=this.value"></label></div><b>Add medicine</b><div class="r" style="margin-top:6px"><label class="fl"><small>Medicine</small><input id="xn" list="pl" oninput="pfill()"><datalist id="pl">${[...new Set(S.meds.map(m=>m.n))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label>${fld('Batch no.','xb')}${fld('Expiry','xe','type="date"')}</div><div class="r">${fld('Packets received','xq','type="number" min="1"')}${fld('Units in 1 packet','xu','type="number" min="1" value="1"')}${fld('Purchase rate / packet (₹)','xr','type="number" step="any"')}${fld('MRP / packet (₹)','xm','type="number" step="any"')}</div><button class="p" onclick="paddl()">+ Add line</button></div>
<div class="c w" style="margin-top:12px"><table><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Packets</th><th>Rate</th><th>MRP</th><th>Amount</th><th></th></tr>${P.items.map((i,x)=>`<tr><td>${esc(i.n)}</td><td>${esc(i.b)}</td><td>${i.e}</td><td>${i.k} × ${i.ps}</td><td>${inr(i.pr)}</td><td>${inr(i.m)}</td><td>${inr(i.pr*i.k)}</td><td><button class="s" onclick="S.pc.items.splice(${x},1);draw()">✕</button></td></tr>`).join('')||'<tr><td colspan="8">No lines yet</td></tr>'}</table><div class="r" style="margin-top:10px"><label class="fl"><small>GST % on purchase (remembered)</small><input type="number" step="any" min="0" value="${P.gst}" onchange="S.pc.gst=Math.max(0,+this.value||0);S.pgst=S.pc.gst;save();draw()"></label></div><p style="text-align:right;margin:4px 0 10px">Subtotal ${inr(sub)} · GST ${inr(g)}<br><b style="font-size:18px">Total ${inr(sub+g)}</b></p><button class="p" ${P.items.length?'':'disabled'} onclick="psave()">Save purchase &amp; add stock</button></div>
<h2 style="margin-top:22px">Recent purchases</h2><div class="c w"><table><tr><th>No.</th><th>Date</th><th>Supplier</th><th>Invoice</th><th>Lines</th><th>Total</th></tr>${S.purch.slice(-8).reverse().map(p=>`<tr><td>${pad('PU-',p.no)}</td><td>${p.date}</td><td>${esc(p.sup)}</td><td>${esc(p.inv)}</td><td>${p.items.length}</td><td>${inr(p.tot)}</td></tr>`).join('')||'<tr><td colspan="6">No purchases yet</td></tr>'}</table></div>`}
function pfill(){const m=[...S.meds].reverse().find(x=>x.n.toLowerCase()==$('xn').value.trim().toLowerCase());if(!m)return;$('xu').value=m.ps||1;if(m.pr)$('xr').value=m.pr;$('xm').value=m.m}
function paddl(){const n=$('xn').value.trim(),k=parseInt($('xq').value)||0,e=$('xe').value;if(!n||!e||k<1)return toast('Medicine, expiry and packets are required');S.pc.items.push({n,b:$('xb').value.trim(),e,k,ps:Math.max(1,parseInt($('xu').value)||1),pr:+$('xr').value||0,m:+$('xm').value||0});draw()}
function psave(){const P=S.pc;if(!P.items.length)return;let sub=0;P.items.forEach(i=>{const u=i.k*i.ps,x=mfind(i.n,i.b);sub+=i.pr*i.k;if(x){x.q+=u;x.pr=i.pr;x.m=i.m||x.m;x.e=i.e;x.ps=i.ps;x.hsn=i.hsn||x.hsn}else{const o=S.meds.find(m=>m.n.toLowerCase()==i.n.toLowerCase());S.meds.push({id:Date.now()+Math.floor(Math.random()*1000),n:i.n,s:o?o.s:'',b:i.b,e:i.e,m:i.m,ps:i.ps,q:u,rx:o?o.rx:0,sch:o?schOf(o):'OTC',pr:i.pr,hsn:i.hsn||(o?o.hsn:'')})}});const g=sub*P.gst/100;S.purch.push({no:nx(S.purch),date:P.date,sup:P.sup||'—',inv:P.inv,items:P.items,sub,gst:g,tot:sub+g});S.pc={sup:'',inv:'',date:D(0),gst:P.gst,items:[]};save();draw();toast('Purchase saved. Stock updated.')}
function preturn(){const R=S.pl,tot=R.items.reduce((a,i)=>a+i.pr*i.q/i.ps,0);
return `<h2>Purchase return</h2><div class="c"><div class="r">${supIn(R,'S.pl')}<label class="fl"><small>Reason</small><input value="${esc(R.reason)}" placeholder="damaged, wrong item…" oninput="S.pl.reason=this.value"></label></div><div class="r"><label class="fl"><small>Medicine batch</small><select id="rm">${S.meds.filter(m=>m.q>0).map(m=>`<option value="${m.id}">${esc(m.n)} · ${esc(m.b)} · ${fmtQ(m)}</option>`).join('')}</select></label>${fld('Quantity','rq','type="number" min="1" value="1"')}<label class="fl"><small>Counted in</small><select id="ru"><option value="p">Packets</option><option value="l">Loose units</option></select></label></div><button class="s" onclick="radd()">+ Add to return</button>
<div class="w"><table><tr><th>Medicine</th><th>Batch</th><th>Units</th><th>Rate / pkt</th><th>Credit</th><th></th></tr>${R.items.map((i,x)=>`<tr><td>${esc(i.n)}</td><td>${esc(i.b)}</td><td>${i.q}</td><td><input type="number" step="any" value="${i.pr}" style="width:80px" onchange="S.pl.items[${x}].pr=+this.value||0;draw()"></td><td>${inr(i.pr*i.q/i.ps)}</td><td><button class="s" onclick="S.pl.items.splice(${x},1);draw()">✕</button></td></tr>`).join('')||'<tr><td colspan="6">Nothing added</td></tr>'}</table></div><p style="text-align:right"><b>Credit value ${inr(tot)}</b></p><button class="p" ${R.items.length?'':'disabled'} onclick="if(saveRet('pr',S.pl.items,S.pl.sup,S.pl.reason)){S.pl={sup:S.pl.sup,reason:'',items:[]};draw()}">Save purchase return</button></div>${retHist('pr')}`}
function radd(){const m=S.meds.find(x=>x.id==$('rm').value);if(!m)return;const ps=m.ps||1,u=(+$('rq').value||1)*($('ru').value=='p'?ps:1),had=S.pl.items.filter(i=>i.id==m.id).reduce((a,i)=>a+i.q,0);if(had+u>m.q)return toast('Only '+fmtQ(m)+' in stock');S.pl.items.push({id:m.id,n:m.n,b:m.b,e:m.e,ps,q:u,pr:m.pr||0});draw()}
function expcn(){const X=S.xs,l=S.meds.filter(m=>m.q>0&&days(m.e)<=90).sort((a,b)=>a.e>b.e?1:-1),v=m=>(m.pr||0)*m.q/(m.ps||1),tot=l.filter(m=>X.ids[m.id]).reduce((a,m)=>a+v(m),0);
return `<h2>Expiry credit note</h2><div class="c"><p style="color:var(--mu);margin-top:0">Tick expired or near-expiry stock (within 90 days) to send back to the supplier and claim a credit note. Credit uses each medicine's purchase rate.</p><div class="r">${supIn(X,'S.xs')}</div><div class="w"><table><tr><th></th><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Rate / pkt</th><th>Credit</th></tr>${l.map(m=>`<tr><td><input type="checkbox" style="width:auto" ${X.ids[m.id]?'checked':''} onchange="S.xs.ids[${m.id}]=this.checked;draw()"></td><td>${esc(m.n)}</td><td>${esc(m.b)}</td><td class="${days(m.e)<0?'bad':'wn'}">${m.e}${days(m.e)<0?' (expired)':''}</td><td>${fmtQ(m)}</td><td>${m.pr?inr(m.pr):'<span class="wn">not set</span>'}</td><td>${inr(v(m))}</td></tr>`).join('')||'<tr><td colspan="7">No expired or near-expiry stock</td></tr>'}</table></div><p style="text-align:right"><b>Credit note value ${inr(tot)}</b></p><button class="p" onclick="xsave()">Create credit note</button></div>${retHist('ex')}`}
function xsave(){const X=S.xs,it=S.meds.filter(m=>X.ids[m.id]&&m.q>0).map(m=>({id:m.id,n:m.n,b:m.b,e:m.e,ps:m.ps||1,q:m.q,pr:m.pr||0}));if(saveRet('ex',it,X.sup,'Expired / near expiry')){S.xs={sup:X.sup,ids:{}};draw()}}
const rr=(s,ix)=>S.sret.filter(r=>r.ref==s.no).reduce((a,r)=>a+r.items.filter(i=>i.ix==ix).reduce((z,i)=>z+i.k,0),0);
function sramt(no){const s=S.sales.find(x=>x.no==no),n=s.sub-s.ld;return n>0?Object.entries(S.srq).reduce((a,[ix,q])=>{const i=s.items[ix];return a+pp(i)*q*(1-i.dp/100)*s.tot/n},0):0}
function sreturn(){const inv=S.sales.filter(s=>s.inv),s=inv.find(x=>x.no==S.srn);
return `<h2>Sell return</h2><div class="c"><label class="fl"><small>Original invoice</small><select onchange="S.srn=+this.value||0;S.srq={};draw()"><option value="">Select invoice…</option>${inv.slice().reverse().map(x=>`<option value="${x.no}" ${x.no==S.srn?'selected':''}>${x.inv} · ${x.date} · ${esc(x.cust)} · ${inr(x.tot)}</option>`).join('')}</select></label>${s?`<div class="w"><table><tr><th>Medicine</th><th>Sold</th><th>Already returned</th><th>Return qty</th></tr>${s.items.map((i,ix)=>{const r=rr(s,ix),mx=i.k-r;return `<tr><td>${esc(i.n)}<br><small>Batch ${esc(i.b)}</small></td><td>${i.k}${i.u=='l'?' loose':i.ps>1?' pkt':''}</td><td>${r}</td><td><input type="number" min="0" max="${mx}" value="${S.srq[ix]||0}" ${mx?'':'disabled'} style="width:70px" oninput="S.srq[${ix}]=Math.min(${mx},Math.max(0,parseInt(this.value)||0));$('srf').textContent=inr(sramt(${s.no}))"></td></tr>`}).join('')}</table></div><div class="r">${fld('Reason','srr','placeholder="wrong medicine, damaged…"')}<label class="fl"><small>Refund by</small><select id="srm"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit note</option><option>Reduce dues</option></select></label></div><p>Refund amount (incl. tax): <b id="srf">${inr(sramt(s.no))}</b></p><button class="p" onclick="srsave(${s.no})">Process return</button>`:''}</div>
<h2 style="margin-top:22px">Sell returns</h2><div class="c w"><table><tr><th>No.</th><th>Date</th><th>Invoice</th><th>Customer</th><th>Items</th><th>Refund</th><th>Reason</th><th></th></tr>${S.sret.slice().reverse().map(r=>`<tr><td>${pad('SR-',r.no)}${r.edited?' <span class="t">edited</span>':''}</td><td>${r.date}</td><td>${r.inv}</td><td>${esc(r.cust)}</td><td style="white-space:normal">${r.items.map(i=>esc(i.n)).join(', ')}</td><td>${inr(r.amt)} (${r.mode})</td><td>${esc(r.reason)}</td><td><button class="s" onclick="srEdit(${r.no})" title="Edit">✎</button> <button class="s" onclick="srDel(${r.no})" title="Delete">✕</button></td></tr>`).join('')||'<tr><td colspan="8">No returns yet</td></tr>'}</table></div>`}
function srsave(no){const s=S.sales.find(x=>x.no==no),n=s.sub-s.ld,it=Object.entries(S.srq).filter(a=>a[1]>0).map(([ix,k])=>{const i=s.items[ix];return{ix:+ix,n:i.n,b:i.b,k,ps:i.ps,u:i.u,m:i.m,dp:i.dp,cp:i.cp}});if(!it.length)return toast('Enter a return quantity');const amt=sramt(no);
it.forEach(i=>{const m=mfind(i.n,i.b);if(m)m.q+=un(i)});S.sret.push({no:nx(S.sret),ref:s.no,inv:s.inv,date:D(0),cust:s.cust,items:it,amt,f:n>0?(s.tx??n)/n:1,reason:$('srr').value,mode:$('srm').value});S.srq={};save();draw();toast('Return processed. Refund '+inr(amt))}

const rrx=(s,ix,skip)=>S.sret.filter(r=>r.ref==s.no&&r!==skip).reduce((a,r)=>a+r.items.filter(i=>i.ix==ix).reduce((z,i)=>z+i.k,0),0);
function sramtOf(s,q){const n=s.sub-s.ld;return n>0?Object.entries(q).reduce((a,[ix,k])=>{const i=s.items[ix];return i?a+pp(i)*k*(1-i.dp/100)*s.tot/n:a},0):0}
function srDel(no){checkPin(()=>{const r=S.sret.find(x=>x.no==no);if(!r)return;if(!confirm('Delete return '+pad('SR-',r.no)+'? The stock this return added back will be removed again.'))return;
for(const i of r.items){const m=mfind(i.n,i.b);if(m&&m.q<un(i))return toast('Cannot delete: '+i.n+' stock has already been sold')}
r.items.forEach(i=>{const m=mfind(i.n,i.b);if(m)m.q-=un(i)});S.sret=S.sret.filter(x=>x!==r);save();draw();toast('Return deleted')})}

// ===== Purchase import (Excel / CSV) =====
function csvParse(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(v=>String(v).trim()!==''))}
function parseExp(v){if(v instanceof Date)return isNaN(v)?'':v.toISOString().slice(0,10);v=String(v??'').trim();let m;
if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
if(m=v.match(/^(\d{1,2})[\/\-.](\d{2}|\d{4})$/)){const y=m[2].length==2?2000+ +m[2]:+m[2],mo=+m[1];if(mo<1||mo>12)return'';return y+'-'+String(mo).padStart(2,'0')+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')}
return''}
function pimportRows(rows){if(rows.length<2)return toast('No data rows found');const h=rows[0].map(x=>String(x??'').toLowerCase().trim()),used={};
const ix=re=>{const i=h.findIndex((t,j)=>!used[j]&&re.test(t));if(i>=0)used[i]=1;return i};
const c={n:ix(/medicine|item|product|name|description/),b:ix(/batch|lot/),e:ix(/exp/),u:ix(/unit|pack ?size|per (pack|strip|box)/),m:ix(/mrp/),r:ix(/rate|ptr|purchase|cost|price/),h:ix(/hsn/),q:ix(/qty|quantity|packets?|strips?|boxes|pack/)};
if(c.n<0||c.q<0)return toast('Need Medicine and Packets (or Qty) columns in the first row');
let ok=0,bad=0;rows.slice(1).forEach(r=>{const g=i=>i<0?'':r[i],n=String(g(c.n)??'').trim(),k=Math.round(+g(c.q));if(!n||!(k>0))return;let e=parseExp(g(c.e));if(!e){e=D(365);bad++}
S.pc.items.push({n,b:String(g(c.b)??'').trim(),e,k,ps:Math.max(1,parseInt(g(c.u))||1),pr:+g(c.r)||0,m:+g(c.m)||0,hsn:String(g(c.h)??'').trim()});ok++});
if(!ok)return toast('No valid lines found');draw();toast('Added '+ok+' lines'+(bad?'. '+bad+' had no readable expiry, set to 1 year from today: please fix them':'. Review, then save the purchase'))}
async function pimport(f){if(!f)return;try{let rows;
if(/\.csv$/i.test(f.name)){rows=csvParse((await f.text()).replace(/^\uFEFF/,''))}
else{if(typeof ExcelJS==='undefined')return toast('Excel library unavailable. Check your internet connection');const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());const ws=wb.worksheets[0];if(!ws)return toast('Empty file');
const cv=c=>c&&typeof c=='object'&&!(c instanceof Date)?(c.result??c.text??(c.richText?c.richText.map(x=>x.text).join(''):'')):c;rows=[];ws.eachRow({includeEmpty:false},r=>rows.push(Array.from({length:ws.columnCount},(_,i)=>cv(r.getCell(i+1).value))))}
pimportRows(rows)}catch(e){toast('Could not read this file')}}
async function ptemplate(){if(typeof ExcelJS==='undefined')return toast('Excel library unavailable');const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Purchase');
ws.columns=['Medicine','Batch','Expiry','Packets','Units per packet','Purchase rate','MRP','HSN'].map((h,i)=>({header:h,key:'c'+i,width:i?15:26}));ws.addRow(['Paracetamol 500mg','PC999','2028-05-31',10,10,22,30,'3004']);styleHead(ws,8);await saveWB(wb,'purchase-import-sample.xlsx')}

function lastSup(n){for(let i=S.purch.length-1;i>=0;i--){const p=S.purch[i];if(p.sup&&p.sup!='—'&&p.items.some(x=>x.n.toLowerCase()==n.toLowerCase()))return p.sup}return''}

return Object.values(g).filter(o=>o.q<=10*o.ps).map(o=>({...o,sug:Math.max(1,20-Math.floor(o.q/o.ps))})).sort((a,b)=>a.n<b.n?-1:1)}

<h2 style="margin-top:22px">Purchase orders</h2><div class="c w"><table><tr><th>No.</th><th>Date</th><th>Supplier</th><th>Lines</th><th></th></tr>${S.po.slice().reverse().map(o=>`<tr><td>${pad('PO-',o.no)}</td><td>${o.date}</td><td>${esc(o.sup)}</td><td>${o.items.length}</td><td><button class="s" onclick="poShow(${o.no})">View / Print</button> <button class="s" onclick="poDel(${o.no})">✕</button></td></tr>`).join('')||'<tr><td colspan="5">No purchase orders yet</td></tr>'}</table></div>`}

// ===== Supplier dues & payments =====
function supRows(){const m={},g=n=>{const k=n.trim().toLowerCase();return m[k]||(m[k]={n:n.trim(),k,pu:0,rt:0,pd:0})};
S.purch.forEach(p=>{if(p.sup&&p.sup!='—')g(p.sup).pu+=p.tot});
S.pret.filter(r=>r.st=='Received'&&r.sup&&r.sup!='—').forEach(r=>g(r.sup).rt+=r.tot);
S.spay.forEach(y=>g(y.sup).pd+=y.amt);
return Object.values(m).map(o=>({...o,due:o.pu-o.rt-o.pd})).sort((a,b)=>a.n<b.n?-1:1)}
const dueF=n=>n<-0.005?'−'+inr(-n)+' (advance)':inr(n);
function suppliers(){const l=supRows(),tot=l.reduce((a,o)=>a+o.due,0);
return `<h2>Suppliers</h2><div class="g"><div class="c"><small>Total payable</small><h3 class="${tot>0?'wn':''}">${dueF(tot)}</h3></div><div class="c"><small>Suppliers</small><h3>${l.length}</h3></div></div><div class="c w"><table><tr><th>Supplier</th><th>Purchased</th><th>Credit notes received</th><th>Paid</th><th>Due</th><th></th></tr>${l.map((o,i)=>`<tr><td>${esc(o.n)}</td><td>${inr(o.pu)}</td><td>${inr(o.rt)}</td><td>${inr(o.pd)}</td><td class="${o.due>0.005?'wn':''}"><b>${dueF(o.due)}</b></td><td><button class="s" onclick="sPay(${i})">Pay</button> <button class="s" onclick="sLedger(${i})">Ledger</button></td></tr>`).join('')||'<tr><td colspan="6">No supplier purchases yet. Enter the supplier name when you save a purchase.</td></tr>'}</table><small style="color:var(--mu)">Due = purchases − credit notes marked Received − payments. Purchases saved without a supplier name are not counted.</small></div>
<h2 style="margin-top:22px">Payments made</h2><div class="c w"><table><tr><th>No.</th><th>Date</th><th>Supplier</th><th>Amount</th><th>Mode</th><th>Note</th><th></th></tr>${S.spay.slice().reverse().map(y=>`<tr><td>${pad('SP-',y.no)}</td><td>${y.date}</td><td>${esc(y.sup)}</td><td>${inr(y.amt)}</td><td>${esc(y.mode)}</td><td>${esc(y.note)}</td><td><button class="s" onclick="spDel(${y.no})">✕</button></td></tr>`).join('')||'<tr><td colspan="7">No payments yet</td></tr>'}</table></div>`}
function sPay(i){const o=supRows()[i];if(!o)return;S.sp=o;const ov=rOv();

function sPaySave(){const a=+$('spa').value;if(!(a>0))return toast('Enter the amount paid');S.spay.push({no:nx(S.spay),date:$('spd').value||D(0),sup:S.sp.n,amt:a,mode:$('spm').value,note:$('spn').value.trim()});save();document.getElementById('inv').style.display='none';draw();toast('Payment saved')}

function sLedger(i){const o=supRows()[i];if(!o)return;const is=n=>(n||'').trim().toLowerCase()==o.k,e=[];
S.purch.filter(p=>is(p.sup)).forEach(p=>e.push({d:p.date,t:'Purchase '+pad('PU-',p.no)+(p.inv?' · inv '+p.inv:''),a:p.tot}));

S.spay.filter(y=>is(y.sup)).forEach(y=>e.push({d:y.date,t:'Payment ('+y.mode+')'+(y.note?' · '+y.note:''),a:-y.amt}));

const ck=n=>(n||'').trim().toLowerCase();

function waPhone(p){p=String(p||'').replace(/\D/g,'').replace(/^0+/,'');return p.length==10?'91'+p:p}
function waOpen(ph,t){const n=waPhone(ph);if(n.length<10)return toast('Add a valid phone number first');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank')}
function waBill(no){const s=S.sales.find(x=>x.no==no);if(!s)return;
const l=s.items.map((i,x)=>(x+1)+'. '+i.n+' × '+i.k+(i.u=='l'?' loose':i.ps>1?' pkt':'')+' = '+inr(pp(i)*i.k*(1-i.dp/100))).join('\n');
S.wa={no};const msg=STORE.name+'\nInvoice '+s.inv+' · '+s.date+'\n\n'+l+'\n\nTotal: '+inr(s.tot)+'\nPaid by: '+s.mode+(s.mode=='Credit'?'\nBalance due: '+inr(custDue(s.cust)):'')+'\n\nThank you!',ov=rOv();
ov.innerHTML=`<div class="iv"><b style="font-size:17px">Send bill on WhatsApp</b><p style="color:var(--mu)">Enter the customer's WhatsApp number (a 10-digit Indian number gets +91 added). WhatsApp opens with this bill ready. Press Send there.</p><div class="r"><label class="fl"><small>WhatsApp number</small><input id="wap" type="tel" placeholder="98xxxxxxxx" value="${esc(s.ph||'')}" oninput="waUp()"></label></div><label class="fl"><small>Message</small><textarea id="wam" rows="9" style="background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;font:inherit;color:inherit" oninput="waUp()">${esc(msg)}</textarea></label><div class="r np" style="margin-top:12px"><a id="wal" class="p" style="text-align:center;text-decoration:none;display:block;padding:9px 14px" target="_blank" rel="noopener" onclick="return waGo()">Open WhatsApp</a><button class="s" onclick="navigator.clipboard.writeText($('wam').value).then(()=>toast('Message copied'))">Copy message</button><button class="s" onclick="document.getElementById('inv').style.display='none'">Close</button></div></div>`;waUp()}
function waUp(){const n=waPhone($('wap').value),a=$('wal');a.href='https://wa.me/'+n+'?text='+encodeURIComponent($('wam').value);a.style.opacity=n.length>=10?1:.55}
function waGo(){const raw=$('wap').value.trim();if(waPhone(raw).length<10){toast('Enter a valid WhatsApp number');return false}
const s=S.sales.find(x=>x.no==S.wa.no);if(s){s.ph=raw;const c=S.cust.find(u=>ck(u.n)==ck(s.cust));if(c&&!c.p)c.p=raw;save()}return true}
function cWa(i,t){const c=S.cust[i];if(!c)return;waOpen(c.p,t=='due'?'Hello '+c.n+', a gentle reminder from '+STORE.name+': your balance due is '+inr(custDue(c.n))+'. Please pay at your convenience. Thank you.':'Hello '+c.n+', your regular medicine ('+c.l+') may be due for a refill. Visit '+STORE.name+' or reply here to order. Thank you.')}
function cAdd(){const n=$('cnn').value.trim();if(!n)return toast('Enter the customer name');const x=S.cust.find(u=>ck(u.n)==ck(n));
if(x){if($('cnp').value.trim())x.p=$('cnp').value.trim();if($('cnl').value.trim())x.l=$('cnl').value.trim()}else S.cust.push({n,p:$('cnp').value.trim(),l:$('cnl').value.trim()||'—',d:D(0)});save();draw();toast(x?'Customer updated':'Customer added')}
function customers(){const tot=recv();
return `<h2>Customers</h2><div class="g"><div class="c"><small>Total receivable (credit sales)</small><h3 class="${tot>0?'wn':''}">${inr(tot)}</h3></div><div class="c"><small>Customers</small><h3>${S.cust.length}</h3></div></div>
<div class="c"><b>Add customer</b><div class="r" style="margin-top:8px"><input id="cnn" placeholder="Name"><input id="cnp" placeholder="Phone (WhatsApp)"><input id="cnl" placeholder="Regular medicine (optional)"><button class="p" style="flex:0 0 auto" onclick="cAdd()">Add</button></div></div>
<div class="c w" style="margin-top:12px"><table><tr><th>Name</th><th>Phone</th><th>Regular medicine</th><th>Last visit</th><th>Refill</th><th>Due</th><th></th></tr>${S.cust.map((c,i)=>{const d=-days(c.d),du=custDue(c.n),rf=d>=20;return `<tr><td>${esc(c.n)}</td><td>${esc(c.p)}</td><td>${esc(c.l)}</td><td>${c.d||'—'}</td><td>${rf?'<span class="t wn">Due</span>':'—'}</td><td class="${du>0.005?'wn':''}">${du>0.005?'<b>'+inr(du)+'</b>':du<-0.005?'−'+inr(-du)+' adv.':'—'}</td><td><button class="s" onclick="cPay(${i})">Payment</button> <button class="s" onclick="cLedger(${i})">Ledger</button>${du>0.005?` <button class="s" onclick="cWa(${i},'due')">💬 Due</button>`:''}${rf?` <button class="s" onclick="cWa(${i},'refill')">💬 Refill</button>`:''}</td></tr>`}).join('')}</table></div>
<h2 style="margin-top:22px">Dues received</h2><div class="c w"><table><tr><th>No.</th><th>Date</th><th>Customer</th><th>Amount</th><th>Mode</th><th>Note</th><th></th></tr>${S.cpay.slice().reverse().map(y=>`<tr><td>${pad('CP-',y.no)}</td><td>${y.date}</td><td>${esc(y.cust)}</td><td>${inr(y.amt)}</td><td>${esc(y.mode)}</td><td>${esc(y.note)}</td><td><button class="s" onclick="cpDel(${y.no})">✕</button></td></tr>`).join('')||'<tr><td colspan="7">No payments yet</td></tr>'}</table></div>`}
function cPay(i){const c=S.cust[i];if(!c)return;S.cp=c;const du=custDue(c.n),ov=rOv();
ov.innerHTML=`<div class="iv"><b style="font-size:17px">Payment from ${esc(c.n)}</b><p style="color:var(--mu)">Current due: ${dueF(du)}</p><div class="r"><label class="fl"><small>Amount (₹)</small><input id="cpa" type="number" step="any" min="0" value="${du>0?du.toFixed(2):''}"></label><label class="fl"><small>Date</small><input id="cpd" type="date" value="${D(0)}"></label></div><div class="r"><label class="fl"><small>Mode</small><select id="cpm"><option>Cash</option><option>UPI</option><option>Card</option></select></label><label class="fl"><small>Note (optional)</small><input id="cpn"></label></div><div class="r"><button class="p" onclick="cPaySave()">Save payment</button><button class="s" onclick="document.getElementById('inv').style.display='none'">Cancel</button></div></div>`}
function cPaySave(){const a=+$('cpa').value;if(!(a>0))return toast('Enter the amount received');S.cpay.push({no:nx(S.cpay),date:$('cpd').value||D(0),cust:S.cp.n,amt:a,mode:$('cpm').value,note:$('cpn').value.trim()});save();document.getElementById('inv').style.display='none';draw();toast('Payment saved')}
function cpDel(no){checkPin(()=>{const y=S.cpay.find(x=>x.no==no);if(!y||!confirm('Delete payment '+pad('CP-',y.no)+' of '+inr(y.amt)+'?'))return;S.cpay=S.cpay.filter(x=>x!==y);save();draw()})}
function cLedger(i){const c=S.cust[i];if(!c)return;const e=[];
S.sales.filter(x=>x.mode=='Credit'&&ck(x.cust)==ck(c.n)).forEach(x=>e.push({d:x.date,t:'Credit bill '+x.inv,a:x.tot}));
S.cpay.filter(y=>ck(y.cust)==ck(c.n)).forEach(y=>e.push({d:y.date,t:'Payment ('+y.mode+')'+(y.note?' · '+y.note:''),a:-y.amt}));
S.sret.filter(r=>r.mode=='Reduce dues'&&ck(r.cust)==ck(c.n)).forEach(r=>e.push({d:r.date,t:'Return '+pad('SR-',r.no)+' ('+r.inv+')',a:-r.amt}));
e.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);let bal=0;const ov=rOv();
ov.innerHTML=`<div class="iv"><b style="font-size:17px">Ledger · ${esc(c.n)}</b><div class="w" style="margin-top:8px"><table><tr><th>Date</th><th>Details</th><th>Amount</th><th>Balance</th></tr>${e.map(x=>{bal+=x.a;return `<tr><td>${x.d}</td><td style="white-space:normal">${esc(x.t)}</td><td>${x.a<0?'−'+inr(-x.a):inr(x.a)}</td><td>${dueF(bal)}</td></tr>`}).join('')||'<tr><td colspan="4">No credit history</td></tr>'}</table></div><div class="r np" style="margin:14px 0 0"><button class="p" onclick="window.print()">Print</button><button class="s" onclick="document.getElementById('inv').style.display='none'">Close</button></div></div>`}

function deadRows(N){const g={};S.meds.filter(m=>m.q>0&&days(m.e)>=0).forEach(m=>{const k=m.n.toLowerCase(),o=g[k]||(g[k]={n:m.n,q:0,ps:m.ps||1,val:0,est:false});o.q+=m.q;o.ps=m.ps||o.ps;o.val+=(m.pr||m.m)*m.q/(m.ps||1);if(!m.pr)o.est=true});
const last=(a,n)=>{const k=n.toLowerCase();let d='';a.forEach(x=>{const t=x.date||D(0);if(t>d&&x.items.some(i=>i.n.toLowerCase()==k))d=t});return d};
return Object.values(g).map(o=>{const ls=last(S.sales,o.n),lb=last(S.purch,o.n),r=ls>lb?ls:lb;return{...o,ls,age:r?-days(r):null}}).filter(o=>o.age===null||o.age>=N).sort((a,b)=>b.val-a.val)}
function alts(q){q=(q||'').trim().toLowerCase();if(!q)return[];const hit=S.meds.filter(m=>(m.n+' '+m.s).toLowerCase().includes(q)),sl=new Set(hit.map(m=>(m.s||'').trim().toLowerCase()).filter(Boolean));
return S.meds.filter(m=>m.q>0&&days(m.e)>=0&&sl.has((m.s||'').trim().toLowerCase())).sort((a,b)=>a.m/(a.ps||1)-b.m/(b.ps||1))}
function altH(q){if(!q.trim())return '<tr><td colspan="6">Type a medicine or salt name above</td></tr>';const l=alts(q);return l.map(m=>`<tr><td>${esc(m.n)}${schTag(m)}</td><td>${esc(m.s)}</td><td>${esc(m.b)}</td><td>${m.e}</td><td>${inr(m.m/(m.ps||1))}</td><td>${fmtQ(m)}</td></tr>`).join('')||'<tr><td colspan="6">No in-stock medicine with this salt</td></tr>'}
function stockrep(){if(!S.sr)S.sr={dead:90,q:''};const R=S.sr,l=deadRows(R.dead),sc=!S.pin||S.unlocked,tv=l.reduce((a,o)=>a+o.val,0);
return `<h2>Stock reports</h2><div class="c"><b>Dead stock</b><p style="color:var(--mu);margin:4px 0 10px">In-stock medicines with no sale and no purchase in the chosen period. Move them with a discount or return them to the supplier before they expire.</p><div class="r"><label class="fl"><small>Not sold or bought for</small><select onchange="S.sr.dead=+this.value;draw()">${[30,60,90,180].map(n=>`<option value="${n}" ${R.dead==n?'selected':''}>${n} days</option>`).join('')}</select></label></div><div class="w"><table><tr><th>Medicine</th><th>Stock</th><th>Last sold</th><th>Idle days</th>${sc?'<th>Value</th>':''}</tr>${l.map(o=>`<tr><td>${esc(o.n)}</td><td>${fmtQ(o)}</td><td>${o.ls||'Never'}</td><td>${o.age===null?'—':o.age}</td>${sc?`<td>${inr(o.val)}${o.est?'*':''}</td>`:''}</tr>`).join('')||'<tr><td colspan="5">No dead stock in this period</td></tr>'}</table></div>${sc?`<small style="color:var(--mu)">Total value ${inr(tv)}. * = purchase rate not set, MRP used.</small>`:''}</div>
<div class="c" style="margin-top:12px"><b>Alternatives with the same salt</b><p style="color:var(--mu);margin:4px 0 10px">Matches on the Salt field of your inventory. Cheapest per unit first.</p><div class="r"><input placeholder="Medicine or salt name" value="${esc(R.q)}" oninput="S.sr.q=this.value;$('alr').innerHTML=altH(this.value)"></div><div class="w"><table><tr><th>Medicine</th><th>Salt</th><th>Batch</th><th>Expiry</th><th>MRP / unit</th><th>Stock</th></tr><tbody id="alr">${altH(R.q)}</tbody></table></div></div>`}

// ===== Bills (invoice history) =====
function billList(){const F=S.bf,q=(F.q||'').trim().toLowerCase();return S.sales.filter(x=>{const d=x.date||D(0);if(F.from&&d<F.from)return false;if(F.to&&d>F.to)return false;if(F.mode!='all'&&x.mode!=F.mode)return false;if(!q)return true;return (String(x.inv||'')+' '+(x.cust||'')+' '+(x.ph||'')+' '+x.items.map(i=>i.n).join(' ')).toLowerCase().includes(q)}).slice().sort((a,b)=>b.no-a.no)}
function billSumH(l){const t=l.reduce((a,x)=>a+x.tot,0),cr=l.filter(x=>x.mode=='Credit').reduce((a,x)=>a+x.tot,0);return `<div class="c"><small>Bills</small><h3>${l.length}</h3></div><div class="c"><small>Total amount</small><h3>${inr(t)}</h3></div><div class="c"><small>Average bill</small><h3>${inr(l.length?t/l.length:0)}</h3></div><div class="c"><small>On credit</small><h3 class="wn">${inr(cr)}</h3></div>`}
function billRowsH(l){return l.slice(0,300).map(x=>`<tr><td>${x.inv||'—'}${x.edited?' <span class="t">edited</span>':''}</td><td>${x.date||''} ${x.time||''}</td><td>${esc(x.cust)}</td><td>${x.items.length}</td><td>${x.mode}</td><td><b>${inr(x.tot)}</b></td><td><button class="s" onclick="showInv(${x.no})">View / Print</button> <button class="s" onclick="editInv(${x.no})" title="Edit">✎</button> <button class="s" onclick="waBill(${x.no})" title="WhatsApp">${WAI}</button></td></tr>`).join('')||'<tr><td colspan="7">No bills match these filters</td></tr>'}
function billUp(){const l=billList();$('bs').innerHTML=billSumH(l);$('bt').innerHTML=billRowsH(l);$('bn').textContent=l.length>300?'Showing the latest 300 of '+l.length+' bills. Narrow the dates to see the rest.':''}
function bills(){if(!S.bf)S.bf={q:'',from:D(-30),to:D(0),mode:'all'};const F=S.bf,l=billList();
return `<h2>Bills</h2><div class="c"><div class="r"><label class="fl"><small>Search</small><input placeholder="Invoice no., customer, phone or medicine" value="${esc(F.q)}" oninput="S.bf.q=this.value;billUp()"></label><label class="fl"><small>From</small><input type="date" value="${F.from}" onchange="S.bf.from=this.value;billUp()"></label><label class="fl"><small>To</small><input type="date" value="${F.to}" onchange="S.bf.to=this.value;billUp()"></label><label class="fl"><small>Payment mode</small><select onchange="S.bf.mode=this.value;billUp()">${['all','Cash','UPI','Card','Credit'].map(m=>`<option value="${m}" ${F.mode==m?'selected':''}>${m=='all'?'All modes':m}</option>`).join('')}</select></label></div><div class="r"><button class="s" style="flex:0 0 auto" onclick="go('billing')">＋ New bill</button><button class="s" style="flex:0 0 auto" onclick="dlBills()">⬇ Download list (Excel)</button></div></div>
<div class="g" id="bs" style="margin-top:12px">${billSumH(l)}</div><div class="c w"><table><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Items</th><th>Mode</th><th>Total</th><th></th></tr><tbody id="bt">${billRowsH(l)}</tbody></table><small id="bn" style="color:var(--mu)">${l.length>300?'Showing the latest 300 of '+l.length+' bills. Narrow the dates to see the rest.':''}</small></div>`}
async function dlBills(){const l=billList();if(!l.length)return toast('No bills to download');if(typeof ExcelJS==='undefined')return toast('Excel library unavailable. Check your internet connection');
const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Bills');
ws.columns=[['Invoice','inv',12],['Date','d',12],['Time','t',10],['Customer','c',22],['Phone','p',14],['Payment mode','m',14],['Items','i',40],['Total','tot',12]].map(c=>({header:c[0],key:c[1],width:c[2]}));
l.slice().reverse().forEach(x=>ws.addRow({inv:x.inv||'',d:x.date||'',t:x.time||'',c:x.cust,p:x.ph||'',m:x.mode,i:x.items.map(i=>i.n+' x'+i.k).join(', '),tot:+x.tot.toFixed(2)}));
styleHead(ws,8);await saveWB(wb,'Bills-'+S.bf.from+'-to-'+S.bf.to+'.xlsx');toast('Downloaded '+l.length+' bills')}
function margin(){const P=S.mp,cut=P=='all'?'':D(P=='today'?0:-(+P-1)),ok=d=>!cut||d>=cut,A={};let rv=0,cs=0,miss=0;
const add=(i,f,g)=>{const r=pp(i)*i.k*(1-i.dp/100)*f*g,c=(i.cp||0)*un(i)/(i.ps||1)*g;if(!i.cp)miss++;const o=A[i.n]||(A[i.n]={u:0,r:0,c:0});o.u+=un(i)*g;o.r+=r;o.c+=c;rv+=r;cs+=c};
S.sales.filter(s=>ok(s.date||D(0))).forEach(s=>{const n=s.sub-s.ld,f=n>0?(s.tx??n)/n:1;s.items.forEach(i=>add(i,f,1))});S.sret.filter(r=>ok(r.date)).forEach(r=>r.items.forEach(i=>add(i,r.f,-1)));
const pf=rv-cs,pc=x=>x.r?(x.r-x.c)/x.r*100:0,l=Object.entries(A).sort((a,b)=>(b[1].r-b[1].c)-(a[1].r-a[1].c));
return `<h2>Margin</h2><div class="r"><select onchange="S.mp=this.value;draw()">${[['today','Today'],['7','Last 7 days'],['30','Last 30 days'],['all','All time']].map(a=>`<option value="${a[0]}" ${a[0]==P?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="g"><div class="c"><small>Sales (excl. tax, net of returns)</small><h3>${inr(rv)}</h3></div><div class="c"><small>Cost of goods</small><h3>${inr(cs)}</h3></div><div class="c"><small>Gross profit</small><h3>${inr(pf)}</h3></div><div class="c"><small>Margin</small><h3>${rv?(pf/rv*100).toFixed(1):'0.0'}%</h3></div></div>${miss?'<p class="wn">Some sold items have no purchase rate, so their margin is overstated. Record a purchase, or set the purchase rate in Inventory.</p>':''}
<div class="c w"><b>Margin by medicine</b><table><tr><th>Medicine</th><th>Units sold</th><th>Sales</th><th>Cost</th><th>Profit</th><th>Margin</th></tr>${l.map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.u}</td><td>${inr(x.r)}</td><td>${inr(x.c)}</td><td>${inr(x.r-x.c)}</td><td>${pc(x).toFixed(1)}%</td></tr>`).join('')||'<tr><td colspan="6">No sales in this period</td></tr>'}</table></div>
<div class="c w" style="margin-top:12px"><b>Margin on current stock (MRP vs purchase rate, per packet)</b><table><tr><th>Medicine</th><th>Batch</th><th>MRP</th><th>Purchase rate</th><th>Margin ₹</th><th>Margin %</th></tr>${S.meds.map(m=>`<tr><td>${esc(m.n)}</td><td>${esc(m.b)}</td><td>${inr(m.m)}</td><td>${m.pr?inr(m.pr):'—'}</td><td>${m.pr?inr(m.m-m.pr):'—'}</td><td>${m.pr&&m.m?((m.m-m.pr)/m.m*100).toFixed(1)+'%':'—'}</td></tr>`).join('')}</table></div>`}

function taxOf(s){if(s.cg!==undefined)return{tx:s.tx,cg:s.cg,sg:s.sg,ig:s.ig,gst:s.gst};const n=s.sub-s.ld,tx=n-(s.bd||0);if(!s.gst)return{tx,cg:0,sg:0,ig:0,gst:0};return s.tt=='IG'?{tx,cg:0,sg:0,ig:s.gst,gst:s.gst}:{tx,cg:s.gst/2,sg:s.gst/2,ig:0,gst:s.gst}}
function monthsList(){return[...new Set(S.sales.map(s=>(s.date||D(0)).slice(0,7)))].sort().reverse()}
function csvEsc(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return rows.map(r=>r.map(csvEsc).join(',')).join('\r\n')}
function dlFile(name,text){const b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function gstBills(ym){return S.sales.filter(s=>(s.date||D(0)).startsWith(ym)&&taxOf(s).gst>0)}
function nonGstBills(ym){return S.sales.filter(s=>(s.date||D(0)).startsWith(ym)&&taxOf(s).gst<=0)}
function dlGSTCsv(){const ym=$('gm').value,l=gstBills(ym);if(!l.length)return toast('No GST bills in this month');const rows=[['Invoice No','Date','Customer Name','Phone','Taxable Value','CGST %','CGST Amount','SGST %','SGST Amount','IGST %','IGST Amount','Total Tax','Invoice Value','Payment Mode']];l.forEach(s=>{const t=taxOf(s);rows.push([s.inv,s.date,s.cust,s.ph||'',t.tx.toFixed(2),s.rc||'',t.cg.toFixed(2),s.rs||'',t.sg.toFixed(2),s.ri||'',t.ig.toFixed(2),t.gst.toFixed(2),s.tot.toFixed(2),s.mode])});dlFile('GST-bills-'+ym+'.csv',toCSV(rows));toast('Downloaded '+l.length+' GST bills')}
function dlNonGSTCsv(){const ym=$('gm').value,l=nonGstBills(ym);if(!l.length)return toast('No non-GST bills in this month');const rows=[['Invoice No','Date','Customer Name','Phone','Invoice Value','Payment Mode']];l.forEach(s=>rows.push([s.inv,s.date,s.cust,s.ph||'',s.tot.toFixed(2),s.mode]));dlFile('Non-GST-bills-'+ym+'.csv',toCSV(rows));toast('Downloaded '+l.length+' non-GST bills')}
function gstExportH(){const ms=monthsList(),cur=D(0).slice(0,7);if(!ms.includes(cur))ms.unshift(cur);if(!S.gmon||!ms.includes(S.gmon))S.gmon=ms[0];const ym=S.gmon,g=gstBills(ym),ng=nonGstBills(ym),gt=g.reduce((a,s)=>a+s.tot,0),nt=ng.reduce((a,s)=>a+s.tot,0);
return `<div class="c" style="margin-top:12px"><b>Monthly GST export</b><p style="color:var(--mu);margin:4px 0 10px">Download the month's bills as two separate Excel files — GST bills and non-GST bills — in a sales-register format your accountant or the GST portal's offline tool can use for GSTR-1 filing.</p>
<div class="r"><select id="gm" onchange="S.gmon=this.value;draw()">${ms.map(m=>`<option value="${m}" ${m==ym?'selected':''}>${new Date(m+'-01').toLocaleDateString([],{month:'long',year:'numeric'})}</option>`).join('')}</select></div>
<div class="g"><div class="c"><small>GST bills</small><h3>${g.length}</h3><small>${inr(gt)}</small></div><div class="c"><small>Non-GST bills</small><h3>${ng.length}</h3><small>${inr(nt)}</small></div></div>

const LOCKED=['margin','reports','preturn','expcn','sreturn','settings','register','suppliers'];
function armLock(){clearTimeout(S.lt);if(S.pin)S.lt=setTimeout(lockNow,5*60*1000)}
function lockNow(){clearTimeout(S.lt);S.unlocked=false;if(LOCKED.includes(S.view))S.view='dashboard';const o=document.getElementById('inv');if(o)o.style.display='none';draw()}
['click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(S.unlocked&&S.pin)armLock()}));
function checkPin(action){if(!S.pin||S.unlocked)return action();pinAsk(action)}
function pinAsk(cb){let o=document.getElementById('inv');if(!o){o=document.createElement('div');o.id='inv';o.className='ov';document.body.appendChild(o)}o.style.display='flex';S.pinCb=cb;
o.innerHTML=`<div class="iv"><b style="font-size:17px">Owner PIN required</b><p style="color:var(--mu)">This action is locked. Enter the owner PIN to continue.</p><div class="r"><input id="ppin" type="password" maxlength="6" placeholder="PIN" onkeydown="if(event.key=='Enter')pinTry()"></div><div class="r"><button class="p" onclick="pinTry()">Unlock</button><button class="s" onclick="document.getElementById('inv').style.display='none'">Cancel</button></div></div>`;

function pinTry(){if($('ppin').value===S.pin){S.unlocked=true;armLock();document.getElementById('inv').style.display='none';const cb=S.pinCb;S.pinCb=null;if(cb)cb()}else toast('Wrong PIN')}

function pinOff(){S.pin='';S.unlocked=false;save();try{localStorage.removeItem('medios_pin')}catch(e){}draw();toast('PIN removed')}

function backupData(){return{meds:S.meds,sales:S.sales,cust:S.cust,sret:S.sret,purch:S.purch,pret:S.pret,pgst:S.pgst,gm:S.gm,gd:S.gd,tax:S.tax,po:S.po,spay:S.spay,cpay:S.cpay,pin:S.pin,store:STORE}}
async function dlBackupXlsx(){
if(typeof ExcelJS==='undefined')return toast('Excel library unavailable. Check your internet connection');
const wb=new ExcelJS.Workbook();
const sh=(name,cols,rows)=>{const ws=wb.addWorksheet(name);ws.columns=cols.map(c=>({header:c[0],key:c[1],width:c[2]||14}));rows.forEach(r=>ws.addRow(r));styleHead(ws,cols.length)};
sh('Medicines',[['Name','n',26],['Salt','s',18],['Batch','b'],['Expiry','e'],['MRP / packet','m'],['Purchase rate','pr'],['Units / packet','ps'],['Stock (units)','q'],['Type','sch',14],['HSN','hsn'],['Barcode','bc']],S.meds.map(m=>({...m,ps:m.ps||1,sch:schName(schOf(m))})));
sh('Bills',[['Invoice','inv'],['Date','date'],['Time','time'],['Customer','cust',20],['Phone','ph'],['Mode','mode'],['Taxable','tx'],['Total tax','gst'],['Total','tot']],S.sales.map(s=>{const t=taxOf(s);return{inv:s.inv,date:s.date,time:s.time,cust:s.cust,ph:s.ph||'',mode:s.mode,tx:+t.tx.toFixed(2),gst:+t.gst.toFixed(2),tot:+s.tot.toFixed(2)}}));
sh('Bill items',[['Invoice','inv'],['Medicine','n',26],['Batch','b'],['Qty','k'],['Unit','u'],['MRP','m'],['Disc %','dp'],['Amount','a']],S.sales.flatMap(s=>s.items.map(i=>({inv:s.inv,n:i.n,b:i.b,k:i.k,u:i.u=='l'?'Loose':'Packet',m:i.m,dp:i.dp,a:+(pp(i)*i.k*(1-i.dp/100)).toFixed(2)}))));
sh('Customers',[['Name','n',20],['Phone','p'],['Regular medicine','l',24],['Last visit','d']],S.cust);
sh('Purchases',[['No.','no'],['Date','date'],['Supplier','sup',20],['Invoice','inv'],['Lines','l'],['Total','tot']],S.purch.map(p=>({no:pad('PU-',p.no),date:p.date,sup:p.sup,inv:p.inv,l:p.items.length,tot:+p.tot.toFixed(2)})));
sh('Sell returns',[['No.','no'],['Date','date'],['Invoice','inv'],['Customer','cust',20],['Refund','amt'],['Mode','mode'],['Reason','reason',24]],S.sret.map(r=>({...r,no:pad('SR-',r.no),amt:+r.amt.toFixed(2)})));
sh('Purchase returns',[['CN no.','cn'],['Date','date'],['Supplier','sup',20],['Value','tot'],['Status','st'],['Reason','reason',24]],S.pret.map(r=>({...r,tot:+r.tot.toFixed(2)})));
const js=JSON.stringify(backupData()),rd=wb.addWorksheet('_restore_data');
for(let i=0;i<js.length;i+=30000)rd.addRow([js.slice(i,i+30000)]);
rd.state='hidden';
await saveWB(wb,'medios-backup-'+D(0)+'.xlsx');toast('Excel backup downloaded')}
function rdFile(f){if(!f)return;
if(/\.xlsx$/i.test(f.name)){f.arrayBuffer().then(async buf=>{try{const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);const ws=wb.getWorksheet('_restore_data');if(!ws)throw 0;let t='';ws.eachRow(r=>{t+=r.getCell(1).value});S.rb=JSON.parse(t);S.rconf=false;draw()}catch(e){toast('Not a MediOS Excel backup');S.rb=null}});return}
const r=new FileReader();r.onload=()=>{try{S.rb=JSON.parse(r.result);S.rconf=false;draw()}catch(e){toast('Not a valid backup file');S.rb=null}};r.readAsText(f)}
function doRestore(){if(!S.rb)return;if(!S.rconf){S.rconf=true;draw();return}
const b=S.rb;S.meds=b.meds||[];S.sales=b.sales||[];S.cust=b.cust||[];S.sret=b.sret||[];S.purch=b.purch||[];S.pret=b.pret||[];S.pgst=b.pgst??5;S.gm=b.gm||{};S.gd=b.gd??5;S.tax=b.tax||{c:2.5,s:2.5,i:0};S.po=b.po||[];S.spay=b.spay||[];S.cpay=b.cpay||[];
if(b.pin!=null){S.pin=b.pin;try{b.pin?localStorage.setItem('medios_pin',b.pin):localStorage.removeItem('medios_pin')}catch(e){}}
if(b.store){Object.assign(STORE,b.store);persistStore()}
S.rb=null;S.rconf=false;save();S.view='dashboard';draw();toast('Backup restored')}

${S.pin?`<p>PIN is set.</p><div class="r"><button class="p" onclick="lockNow()">🔒 Lock now</button><button class="s" onclick="pinChange()">Change PIN</button><button class="s" onclick="pinOff()">Remove PIN</button></div>`:`<div class="r"><input id="npin" type="password" maxlength="6" placeholder="Set a 4–6 digit PIN"><button class="p" style="flex:0 0 auto" onclick="pinSet()">Set PIN</button></div>`}</div>
<div class="c" style="margin-top:12px"><b>Shop details</b><p style="color:var(--mu)">Printed on every invoice and drug register. Your drug licence number must appear on the bill.</p><div class="r"><label class="fl"><small>Shop name</small><input id="sn" value="${esc(STORE.name)}"></label><label class="fl"><small>Address &amp; phone</small><input id="sa" value="${esc(STORE.addr)}"></label></div><div class="r"><label class="fl"><small>GSTIN</small><input id="sg" value="${esc(STORE.gstin)}"></label><label class="fl"><small>Drug licence no. (Form 20/21)</small><input id="sd" value="${esc(STORE.dl)}"></label><label class="fl"><small>Licence valid till</small><input id="sv" type="date" value="${esc(STORE.dle)}"></label></div><button class="p" onclick="saveStore()">Save shop details</button></div>

${S.rb?`<p class="wn">This file has ${(S.rb.meds||[]).length} medicines and ${(S.rb.sales||[]).length} bills. Restoring replaces everything currently saved in this browser.</p>`:''}</div>
<div class="c" style="margin-top:12px"><b>About this app</b><p style="color:var(--mu)">MediOS runs entirely in this browser tab — there is no shared server, so data does not sync between devices or staff computers. Moving to a real multi-device setup needs a hosted backend (for example Supabase or Firebase) with proper staff logins, which is a separate build.</p></div>`}

o.innerHTML=`<div class="iv"><b style="font-size:17px">Scan barcode</b><p style="color:var(--mu)">Point the camera at the barcode on the medicine pack.</p><div id="bcreader" style="width:100%;border-radius:10px;overflow:hidden"></div><p id="bcerr" class="bad"></p><div class="r"><button class="s" onclick="bcClose()">Cancel</button></div></div>`;

S.bcInst=new Html5Qrcode('bcreader');S.bcInst.start({facingMode:'environment'},{fps:10,qrbox:220},code=>bcResult(code),()=>{}).catch(e=>{if($('bcerr'))$('bcerr').textContent='Could not access the camera: '+e})},0)}

function bcResult(code){const t=S.bcScan.target;bcClose();

function hsnSummary(ym){const map={};gstBills(ym).forEach(s=>{const t=taxOf(s),n=s.sub-s.ld-(s.bd||0),f=n>0?t.tx/n:1;s.items.forEach(i=>{const med=mfind(i.n,i.b),h=(med&&med.hsn)||'Not set',amt=pp(i)*i.k*(1-i.dp/100)*f,share=t.tx?amt/t.tx:0,o=map[h]||(map[h]={qty:0,tax:0,cg:0,sg:0,ig:0});o.qty+=un(i);o.tax+=amt;o.cg+=t.cg*share;o.sg+=t.sg*share;o.ig+=t.ig*share})});return map}
function dlHSNCsv(){const ym=$('gm').value,map=hsnSummary(ym),ent=Object.entries(map);if(!ent.length)return toast('No GST bills in this month');const rows=[['HSN Code','Units Sold','Taxable Value','CGST','SGST','IGST','Total Tax']];ent.forEach(([h,o])=>rows.push([h,o.qty,o.tax.toFixed(2),o.cg.toFixed(2),o.sg.toFixed(2),o.ig.toFixed(2),(o.cg+o.sg+o.ig).toFixed(2)]));dlFile('HSN-summary-'+ym+'.csv',toCSV(rows));toast('Downloaded HSN summary')}

const PINV_PROMPT="You help staff at an Indian medical store enter a supplier's purchase invoice/bill photo into their inventory system. Return ONLY a JSON object, no markdown, with keys: found (boolean), supplier (name printed on the invoice, else null), inv_no (supplier's invoice/bill number, else null), items (array). Each item: name (medicine name as printed), batch (batch/lot no. if shown, else null), expiry (YYYY-MM-DD using the last day of the printed month, else null), qty (number of packets/strips/boxes purchased — the quantity column, not the pack size), rate (purchase rate per packet/strip/box in rupees, else null), mrp (MRP per packet if printed, else null), hsn (HSN code if printed, else null). Only copy numbers and text that are visibly printed; never guess or invent values, use null instead. If the photo doesn't show a purchase invoice, return {\"found\":false}.";
function pscanH(){const R=S.pscan;return `<b>📷 Scan supplier invoice with AI</b><p style="color:var(--mu);margin:4px 0 10px">Upload or photograph a supplier's purchase bill. The AI reads the line items so you don't have to type each one.</p>
<div class="r">${R.cam?'':'<input id="pf" type="file" accept="image/*" onchange="ppick(this.files[0])">'}${R.cam?'':'<button class="s" style="flex:0 0 auto" onclick="pcamOpen()">📷 Use camera</button>'}${R.img&&!R.cam?`<button class="p" style="flex:0 0 auto" ${R.busy||!S.key?'disabled':''} onclick="panalyse()">${R.busy?'Analysing…':'Analyse'}</button>`:''}</div>
${R.cam?`<div class="c" style="padding:0;overflow:hidden;border-radius:10px;margin-bottom:8px"><video id="pcv" autoplay playsinline muted style="width:100%;display:block;max-height:340px;object-fit:cover;background:#000"></video></div><div class="r"><button class="p" onclick="psnap()">📸 Capture</button><button class="s" onclick="pcamClose()">Cancel</button></div>`:''}
${!S.key?'<p style="color:var(--mu);font-size:13px">Set your Anthropic API key in Inventory → Scan medicine with AI to enable this.</p>':''}
${R.img?`<img src="${R.img}" alt="invoice photo" style="max-height:150px;max-width:100%;border-radius:8px;margin-bottom:8px">`:''}${R.err?`<p class="bad">${esc(R.err)}</p>`:''}${R.res?presH(R.res):''}`}
function presH(x){if(!x.found||!x.items||!x.items.length)return `<div class="c"><b class="wn">Couldn't read line items from this photo.</b><p style="margin:6px 0 0">Try a clearer, flatter photo of the invoice.</p></div>`;
return `<div class="c" style="border-color:var(--ac)"><b>${esc(x.supplier||'Supplier not detected')}</b>${x.inv_no?' · Invoice '+esc(x.inv_no):''}<table><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Rate</th><th>MRP</th></tr>${x.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.batch)||'—'}</td><td>${esc(i.expiry)||'—'}</td><td>${i.qty??'—'}</td><td>${i.rate?inr(+i.rate):'—'}</td><td>${i.mrp?inr(+i.mrp):'—'}</td></tr>`).join('')}</table>
<p style="margin:8px 0"><b>Add these ${x.items.length} lines to this purchase?</b></p><div class="r"><button class="p" onclick="puseScan()">Yes, add lines</button><button class="s" onclick="S.pscan={};$('psc').innerHTML=pscanH()">No, discard</button></div><small style="color:var(--mu)">AI can misread numbers — check quantity, rate and expiry against the paper invoice before saving the purchase.</small></div>`}
function ppick(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.pscan={img:c.toDataURL('image/jpeg',.85)};$('psc').innerHTML=pscanH()};im.src=r.result};r.readAsDataURL(f)}
function pcamOpen(){S.pscan={cam:true};$('psc').innerHTML=pscanH();setTimeout(async()=>{if(!$('pcv'))return;try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});S.pscan.stream=st;$('pcv').srcObject=st}catch(e){S.pscan={};toast('Could not access the camera: '+e.message);$('psc').innerHTML=pscanH()}},0)}
function pcamClose(){try{S.pscan.stream&&S.pscan.stream.getTracks().forEach(t=>t.stop())}catch(e){}S.pscan={};$('psc').innerHTML=pscanH()}
function psnap(){const v=$('pcv');if(!v||!v.videoWidth)return;const c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);try{S.pscan.stream&&S.pscan.stream.getTracks().forEach(t=>t.stop())}catch(e){}S.pscan={img:c.toDataURL('image/jpeg',.85)};$('psc').innerHTML=pscanH()}
async function panalyse(){const R=S.pscan;R.busy=true;R.err='';R.res=null;$('psc').innerHTML=pscanH();
try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:AI_MODEL,max_tokens:1500,system:PINV_PROMPT,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:R.img.split(',')[1]}},{type:'text',text:'Read this supplier purchase invoice.'}]}]})});
const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||('Error '+r.status));
const t=(d.content||[]).filter(x=>x.type=='text').map(x=>x.text).join(''),m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('The AI reply could not be read. Try a clearer photo.');R.res=JSON.parse(m[0])}catch(e){R.err='Could not analyse: '+e.message}
R.busy=false;if($('psc'))$('psc').innerHTML=pscanH()}
function puseScan(){const x=S.pscan.res;if(x.supplier)S.pc.sup=x.supplier;if(x.inv_no)S.pc.inv=x.inv_no;
x.items.forEach(i=>{if(!i.name||!i.qty)return;S.pc.items.push({n:i.name,b:i.batch||'',e:/^\d{4}-\d{2}-\d{2}$/.test(i.expiry||'')?i.expiry:D(365),k:Math.max(1,Math.round(+i.qty)||1),ps:1,pr:+i.rate||0,m:+i.mrp||0,hsn:i.hsn||''})});
S.pscan={};draw();toast('Added '+x.items.length+' lines. Review each one, then save the purchase.')}

function styleHead(ws,ncols){ws.getRow(1).font={bold:true};ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDCEEE4'}};ws.views=[{state:'frozen',ySplit:1}];try{ws.autoFilter={from:{row:1,column:1},to:{row:1,column:ncols}}}catch(e){}}
async function saveWB(wb,filename){const buf=await wb.xlsx.writeBuffer();const b=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function dlGST(){const ym=$('gm').value,l=gstBills(ym).slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:0);if(!l.length)return toast('No GST bills in this month');
if(typeof ExcelJS==='undefined'){toast('Excel library unavailable — downloaded as CSV instead');return dlGSTCsv()}
const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('GST bills');
ws.columns=[{header:'Invoice No',key:'inv',width:14},{header:'Date',key:'date',width:12},{header:'Customer',key:'cust',width:20},{header:'Phone',key:'ph',width:14},{header:'Taxable Value',key:'tx',width:14,style:{numFmt:'#,##0.00'}},{header:'CGST %',key:'rc',width:9,style:{numFmt:'0.00'}},{header:'CGST Amount',key:'cg',width:13,style:{numFmt:'#,##0.00'}},{header:'SGST %',key:'rs',width:9,style:{numFmt:'0.00'}},{header:'SGST Amount',key:'sg',width:13,style:{numFmt:'#,##0.00'}},{header:'IGST %',key:'ri',width:9,style:{numFmt:'0.00'}},{header:'IGST Amount',key:'ig',width:13,style:{numFmt:'#,##0.00'}},{header:'Total Tax',key:'gst',width:12,style:{numFmt:'#,##0.00'}},{header:'Invoice Value',key:'tot',width:14,style:{numFmt:'#,##0.00'}},{header:'Payment Mode',key:'mode',width:14}];
let sTx=0,sCg=0,sSg=0,sIg=0,sGst=0,sTot=0;
l.forEach(s=>{const t=taxOf(s),rc=s.rc!=null?s.rc:(t.tx?+(t.cg/t.tx*100).toFixed(2):0),rs=s.rs!=null?s.rs:(t.tx?+(t.sg/t.tx*100).toFixed(2):0),ri=s.ri!=null?s.ri:(t.tx?+(t.ig/t.tx*100).toFixed(2):0);
ws.addRow({inv:s.inv,date:s.date,cust:s.cust,ph:s.ph||'',tx:+t.tx.toFixed(2),rc,cg:+t.cg.toFixed(2),rs,sg:+t.sg.toFixed(2),ri,ig:+t.ig.toFixed(2),gst:+t.gst.toFixed(2),tot:+s.tot.toFixed(2),mode:s.mode});
sTx+=t.tx;sCg+=t.cg;sSg+=t.sg;sIg+=t.ig;sGst+=t.gst;sTot+=s.tot});
const tr=ws.addRow({cust:'Total',tx:+sTx.toFixed(2),cg:+sCg.toFixed(2),sg:+sSg.toFixed(2),ig:+sIg.toFixed(2),gst:+sGst.toFixed(2),tot:+sTot.toFixed(2)});
tr.font={bold:true};tr.eachCell(c=>c.border={top:{style:'thin'}});
styleHead(ws,14);await saveWB(wb,'GST-bills-'+ym+'.xlsx');toast('Downloaded '+l.length+' GST bills')}
async function dlNonGST(){const ym=$('gm').value,l=nonGstBills(ym).slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:0);if(!l.length)return toast('No non-GST bills in this month');
if(typeof ExcelJS==='undefined'){toast('Excel library unavailable — downloaded as CSV instead');return dlNonGSTCsv()}
const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Non-GST bills');
ws.columns=[{header:'Invoice No',key:'inv',width:14},{header:'Date',key:'date',width:12},{header:'Customer',key:'cust',width:20},{header:'Phone',key:'ph',width:14},{header:'Invoice Value',key:'tot',width:14,style:{numFmt:'#,##0.00'}},{header:'Payment Mode',key:'mode',width:14}];
let sTot=0;l.forEach(s=>{ws.addRow({inv:s.inv,date:s.date,cust:s.cust,ph:s.ph||'',tot:+s.tot.toFixed(2),mode:s.mode});sTot+=s.tot});

async function dlHSN(){const ym=$('gm').value,map=hsnSummary(ym),ent=Object.entries(map).sort((a,b)=>a[0]<b[0]?-1:1);if(!ent.length)return toast('No GST bills in this month');

function init3D(sc){try{

scn.add(new THREE.AmbientLight(0xffffff,.75));
const l1=new THREE.PointLight(0x39ffc0,1.5,70);l1.position.set(9,8,10);scn.add(l1);
const l2=new THREE.PointLight(0x5b9dff,1.2,70);l2.position.set(-10,-6,8);scn.add(l2);
const mat=(c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:c,roughness:.22,metalness:.05,clearcoat:1,clearcoatRoughness:.08},o));
const small=innerWidth<700,items=[];
const half=(m,r,h)=>{const g=new THREE.Group(),c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28,1,true),m),d=new THREE.Mesh(new THREE.SphereGeometry(r,28,14,0,Math.PI*2,0,Math.PI/2),m);c.position.y=h/2;d.position.y=h;g.add(c,d);return g};
const pill=(c1,c2)=>{const g=new THREE.Group(),a=half(mat(c1),.42,.7),b=half(mat(c2),.42,.7);b.rotation.x=Math.PI;g.add(a,b);return g};
const cols=[[0x0f9d6b,0xf4faf7],[0x3b82f6,0xf4faf7],[0xf59e0b,0xffffff],[0x10b981,0x065f46],[0xef4444,0xffffff]];
for(let i=0;i<(small?9:16);i++){const c=cols[i%cols.length],o=pill(c[0],c[1]);o.scale.setScalar(.8+Math.random()*.9);items.push(o)}
for(let i=0;i<(small?4:8);i++){const o=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.26,36),mat(i%2?0xffffff:0xfef3c7));o.scale.setScalar(.8+Math.random()*.6);items.push(o)}
for(let i=0;i<(small?10:22);i++)items.push(new THREE.Mesh(new THREE.SphereGeometry(.15+Math.random()*.3,20,16),mat(0x9ff5d5,{transparent:true,opacity:.35,roughness:.05})));
items.forEach(o=>{o.position.set((Math.random()-.5)*30,(Math.random()-.5)*17,-7+Math.random()*10);o.userData={r:new THREE.Vector3((Math.random()-.5)*.012,(Math.random()-.5)*.012,(Math.random()-.5)*.012),p:Math.random()*6.28,s:.5+Math.random()*.8,y:o.position.y};o.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);scn.add(o)});
const outer=new THREE.Group(),hx=new THREE.Group(),sg=new THREE.SphereGeometry(.2,18,14),cg=new THREE.CylinderGeometry(.035,.035,2.2,8),m1=mat(0x2dd4a6),m2=mat(0x60a5fa),mc=mat(0xe2f5ee,{roughness:.4});
for(let i=0;i<26;i++){const a=i*.55,y=(i-13)*.36,x1=Math.cos(a)*1.1,z1=Math.sin(a)*1.1,s1=new THREE.Mesh(sg,m1),s2=new THREE.Mesh(sg,m2),c=new THREE.Mesh(cg,mc);
s1.position.set(x1,y,z1);s2.position.set(-x1,y,-z1);c.position.y=y;c.rotation.z=Math.PI/2;c.rotation.y=-a;hx.add(s1,s2,c)}
outer.rotation.z=.35;outer.add(hx);scn.add(outer);
const rs=()=>{const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();outer.position.set(Math.min(11,6.53*(w/h)*.78),0,-2)};rs();addEventListener('resize',rs);
let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);if(document.hidden)return;const t=clk.getElapsedTime();
items.forEach(o=>{const u=o.userData;o.rotation.x+=u.r.x;o.rotation.y+=u.r.y;o.rotation.z+=u.r.z;o.position.y=u.y+Math.sin(t*u.s+u.p)*.7});
hx.rotation.y=t*.35;outer.position.y=Math.sin(t*.6)*.4;
cam.position.x+=(mx*3-cam.position.x)*.04;cam.position.y+=(-my*2-Math.min(scrollY,1200)*.004-cam.position.y)*.04;cam.lookAt(0,0,0);R.render(scn,cam)})();
}catch(e){}}
(function(){const sc=document.createElement('div');sc.className='scene';
